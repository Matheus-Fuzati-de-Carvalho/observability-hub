[project]
name = "observability-hub-backend"
version = "0.1.0"
description = "Backend do Observability Hub (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-bigquery>=3.25",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI usa Depends()/Query() como default de parâmetro de rota —
# é o padrão idiomático da lib (e o que o CLAUDE.md manda usar), não um erro.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability_hub"]
