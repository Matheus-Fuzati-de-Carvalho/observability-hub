name: Terraform Apply (dev)

on:
  push:
    branches-ignore:
      - main
    paths:
      - "infra/terraform/environments/dev/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/terraform-apply-dev.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Apply (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SA_DEV }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color
