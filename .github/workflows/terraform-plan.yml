name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/environments/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  plan-dev:
    name: Plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SA_DEV }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../.

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  # Não existe job "Plan (prod)": o WIF de prod (infra/terraform/bootstrap/prod)
  # tem attribute_condition restrito a assertion.ref == "refs/heads/main" — só
  # autentica em push direto pra main, nunca em pull_request (que roda em
  # refs/pull/N/merge). Rodar `terraform plan` em environments/prod localmente
  # antes de merges que tocam infra/terraform/** continua sendo manual.
